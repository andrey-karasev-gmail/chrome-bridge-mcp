<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Chrome Bridge — Settings</title>
  <style>
    body {
      width: 360px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #333;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="number"] {
      flex: 1;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 6px 14px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      background: #2196F3;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #1976D2;
    }
    .status {
      margin-top: 10px;
      min-height: 16px;
      font-size: 12px;
    }
    .status.saved { color: #4CAF50; }
    .status.error { color: #F44336; }
    .info {
      margin-top: 16px;
      color: #666;
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Claude Chrome Bridge — Settings</h1>
  <label for="port">MCP server WebSocket port</label>
  <div class="row">
    <input type="number" id="port" min="1" max="65535" placeholder="9229">
    <button id="save">Save</button>
  </div>
  <div class="status" id="status"></div>
  <div class="info">
    Must match the port the MCP server listens on. The server defaults to
    <code>9229</code> and honours the <code>CHROME_BRIDGE_PORT</code> environment
    variable — if you change it there, set the same value here.
  </div>
  <script src="scripts/options.js" type="module"></script>
</body>
</html>
